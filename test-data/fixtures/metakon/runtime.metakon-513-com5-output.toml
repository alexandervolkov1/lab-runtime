schema_version = 1

[runtime]
key = "metakon-513-com5-output"
display_name = "Metakon 513 COM5 bounded physical output bench"

[server]
host = "127.0.0.1"
port = 7420

[recording]
enabled = true
path = "metakon-513-m9d-write-smoke.sqlite"
policy = "required"

[[resources]]
id = 1
key = "metakon-513-bus"
kind = "windows_com"
port = "COM5"
baud_rate = 9600
data_bits = 8
parity = "none"
stop_bits = 1
flow_control = "none"
read_timeout_ms = 50
write_timeout_ms = 50
open_timeout_ms = 2000
recovery_timeout_ms = 2000

[[instruments]]
id = 1
key = "metakon-513"
kind = "metakon"
definition = "definitions/metakon-513-output.json"
resource_id = 1
address = 5
poll_period_ms = 1000
queue_timeout_ms = 1000
transaction_timeout_ms = 1000

[[references]]
id = 1
key = "temperature-setpoint"
kind = "fixed"
value = 20.0
unit_id = "degC"
unit_symbol = "°C"

[[safe_profiles]]
instrument_id = 1
parameter_id = 3
min = 0.0
max = 100.0
safe_value = 0.0
max_lease_ms = 3000
max_proposal_ttl_ms = 1000
required_evidence = "readback"

[[controllers]]
id = 1
key = "temperature-pid"
input_instrument_id = 1
input_parameter_id = 2
output_instrument_id = 1
output_parameter_id = 3
reference_id = 1
period_ms = 1000
ema_time_constant_ms = 100
ema_warmup_samples = 1
kp = 1.0
ki = 0.0
kd = 0.0
output_min = 0.0
output_max = 10.0
max_input_age_ms = 2000
max_tick_gap_ms = 2500
lease_lifetime_ms = 3000
proposal_ttl_ms = 1000
