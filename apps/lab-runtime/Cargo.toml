[package]
name = "lab-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
lab-lua = { path = "../../crates/lab-lua" }
lab-core = { path = "../../crates/lab-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "=0.3.4"
ctrlc = "3.5"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "hooks", "limits"] }
sha2 = "0.11.0"
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true
