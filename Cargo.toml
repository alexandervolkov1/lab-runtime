[workspace]
members = ["crates/lab-core", "crates/lab-windows-job", "apps/lab-runtime", "apps/lab-workbench", "apps/lab-native-child"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# egui 0.36.2 stores every debug Id/IdSalt source in process-global maps without
# eviction. Disable that crate's diagnostic cfg in dev (also inherited by test).
# Application/Runtime assertions stay enabled; preserve egui overflow checks.
# Other disabled egui diagnostics are documented in
# apps/lab-workbench/src/gui/readonly_v2/ID_MEMORY.md.
[profile.dev.package."egui:0.36.2"]
debug-assertions = false
overflow-checks = true
